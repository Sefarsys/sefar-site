[build]
  publish = "."

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Une seule adresse pour Google : sans www, en https
[[redirects]]
  from = "https://www.sefar-systeme.dz/*"
  to = "https://sefar-systeme.dz/:splat"
  status = 301
  force = true

# Page supprimée : renvoi vers les solutions
[[redirects]]
  from = "/domaines-application.html"
  to = "/solutions.html"
  status = 301
